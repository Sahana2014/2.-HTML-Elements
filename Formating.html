<html>
    <head>
        <title>Formating text</title>
    </head>
    <body>
        <b>This is Bold</b><br>
        <strong>This is strong</strong><br>
        <i>This is i</i><br>
        <em>This is em</em><br>
        <mark>This is mark</mark><br>
        <small>This is small</small><br>
        <del>This is del</del><br>
        <p>H<sub>2</sub>0</p>
        <p>3<sup>2</sup>9</p>
    </body>
</html>
